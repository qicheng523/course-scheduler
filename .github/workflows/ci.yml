# GitHub Actions 自动检查（B 维护 · 2026-11-19 上线）
#
# 什么时候跑：每次 push 到仓库、每次开 PR，自动在 GitHub 的机器上跑。
# 跑什么（按顺序，4 步）：
#   1. 装 Python 3.12 + 依赖（requirements.txt 版本锁死，三台电脑和 CI 装出来一模一样）
#   2. 环境自检 scripts/check_env.py（7 个依赖都要 [OK]）
#   3. 全部测试 python -m pytest -q（过线标准：17 passed 起步，只增不减）
#   4. seed 冒烟：重置空库 → 灌种子 → 核对 19 课 + 35 固定事件（保证数据脚本没坏）
# 怎么看结果：GitHub 仓库 → Actions 标签页 → 绿色 ✓ = 全过；
#             红色 ✗ 就点进去看哪一步挂了，截图发群里。
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip" # 依赖没变时直接复用缓存，跑得快

      - name: 装依赖
        run: pip install -r requirements.txt

      - name: 环境自检（7 个依赖都要 OK）
        run: python scripts/check_env.py

      - name: 跑全部测试
        run: python -m pytest -q

      - name: 验证 seed 脚本没坏（重置 → 灌入 → 核对条数）
        run: |
          python scripts/reset_db.py --yes
          python scripts/seed.py
          python -c "from sqlmodel import Session, select; from app.db import engine; from app.models import Course, FixedEvent; s = Session(engine); c = len(s.exec(select(Course)).all()); e = len(s.exec(select(FixedEvent)).all()); assert c == 19 and e == 35, f'seed 结果不对：course={c} fixed_event={e}'; print(f'seed OK：course={c} fixed_event={e}')"
